[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "nba_homecourtadv2"
version = "0.0.1"
description = "NBA Home Court Advantage Analysis"
authors = [
  { name = "AnPhi" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["nba_homecourtadv2"]
include = ["pyproject.toml", "nba_homecourtadv2/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["nba_homecourtadv2"]
force-sort-within-sections = true

